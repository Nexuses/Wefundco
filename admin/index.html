<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WeFundCo Admin</title>
<link rel="stylesheet" href="../fonts/google-fonts.css">
<link rel="stylesheet" href="/admin/admin.css" />
<style>body.auth-pending{visibility:hidden}</style>
<noscript><meta http-equiv="refresh" content="0;url=/admin/login" /></noscript>
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body class="auth-pending">
  <header class="topbar">
    <a class="topbar__brand" href="/admin" aria-label="WeFundCo Admin">
      <img src="/Assets/WeFundCo-color.png" alt="WeFundCo" class="topbar__logo" />
      <span class="topbar__label">Admin</span>
    </a>
    <div class="topbar__right">
      <span class="topbar__email" id="adminEmail"></span>
      <button class="btn btn--sm" type="button" id="logoutBtn">Log out</button>
    </div>
  </header>

  <main class="wrap">
    <nav class="admin-tabs" aria-label="Admin sections">
      <button type="button" class="admin-tabs__btn is-active" data-tab="waitlist" id="tabWaitlist">Waitlist</button>
      <button type="button" class="admin-tabs__btn" data-tab="onboarding" id="tabOnboarding">Onboarding</button>
    </nav>

    <section id="panelWaitlist" class="admin-panel is-active" aria-labelledby="tabWaitlist">
      <div class="stats">
        <article class="stat"><p class="stat__label">Total waitlist</p><p class="stat__value" id="statTotal">—</p></article>
        <article class="stat"><p class="stat__label">This week</p><p class="stat__value" id="statWeek">—</p></article>
        <article class="stat"><p class="stat__label">Startups</p><p class="stat__value" id="statStartup">—</p></article>
        <article class="stat"><p class="stat__label">Investors</p><p class="stat__value" id="statInvestor">—</p></article>
      </div>

      <div class="toolbar">
        <input id="search" type="search" placeholder="Search email" />
        <select id="roleFilter">
          <option value="all">All roles</option>
          <option value="startup">Startup</option>
          <option value="investor">Investor</option>
          <option value="partner">Partner</option>
          <option value="general">General</option>
        </select>
        <button class="btn btn--ghost" type="button" id="exportBtn">Export CSV</button>
      </div>

      <section class="table-card">
        <table>
          <thead>
            <tr>
              <th>Email</th>
              <th>Phone</th>
              <th>Role</th>
              <th>Source</th>
              <th>Page</th>
              <th>Joined</th>
              <th class="col-actions">Delete</th>
            </tr>
          </thead>
          <tbody id="rows">
            <tr><td class="empty" colspan="7">Loading waitlist…</td></tr>
          </tbody>
        </table>
        <div class="pager">
          <span id="pageInfo"></span>
          <div>
            <button class="btn btn--ghost btn--sm" type="button" id="prevBtn">Previous</button>
            <button class="btn btn--ghost btn--sm" type="button" id="nextBtn">Next</button>
          </div>
        </div>
      </section>
    </section>

    <section id="panelOnboarding" class="admin-panel" hidden aria-labelledby="tabOnboarding">
      <div class="stats">
        <article class="stat"><p class="stat__label">Total submissions</p><p class="stat__value" id="obStatTotal">—</p></article>
        <article class="stat"><p class="stat__label">This week</p><p class="stat__value" id="obStatWeek">—</p></article>
        <article class="stat"><p class="stat__label">Startups</p><p class="stat__value" id="obStatStartup">—</p></article>
        <article class="stat"><p class="stat__label">Investors</p><p class="stat__value" id="obStatInvestor">—</p></article>
      </div>

      <div class="toolbar">
        <input id="obSearch" type="search" placeholder="Search name or email" />
        <select id="obRoleFilter">
          <option value="all">All roles</option>
          <option value="startup">Startup</option>
          <option value="investor">Investor</option>
        </select>
        <button class="btn btn--ghost" type="button" id="obExportBtn">Export CSV</button>
      </div>

      <section class="table-card">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Role</th>
              <th>Submitted</th>
              <th>Files</th>
              <th class="col-actions">Actions</th>
            </tr>
          </thead>
          <tbody id="onboardingRows">
            <tr><td class="empty" colspan="7">Loading onboarding…</td></tr>
          </tbody>
        </table>
        <div class="pager">
          <span id="obPageInfo"></span>
          <div>
            <button class="btn btn--ghost btn--sm" type="button" id="obPrevBtn">Previous</button>
            <button class="btn btn--ghost btn--sm" type="button" id="obNextBtn">Next</button>
          </div>
        </div>
      </section>
    </section>
  </main>

  <div class="modal" id="onboardingModal" hidden aria-hidden="true" role="dialog" aria-labelledby="onboardingModalTitle">
    <div class="modal__backdrop" data-modal-close></div>
    <div class="modal__panel">
      <header class="modal__head">
        <h2 class="modal__title" id="onboardingModalTitle">Submission</h2>
        <button type="button" class="modal__close" data-modal-close aria-label="Close">&times;</button>
      </header>
      <div class="modal__body" id="onboardingModalBody"></div>
    </div>
  </div>

  <script src="/admin/admin.js?v=20261027c"></script>
</body>
</html>
