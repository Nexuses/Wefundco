<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin login | WeFundCo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cambo&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
  <div class="auth">
    <section class="auth__panel">
      <a class="auth__brand" href="/">WeFundCo</a>
      <div>
        <p class="auth__kicker">Private admin</p>
        <h2 class="auth__headline">The waitlist, <em>under one roof.</em></h2>
      </div>
      <p class="auth__foot">From discovery to diligence. From readiness to transaction.</p>
    </section>
    <section class="auth__form-wrap">
      <form class="auth__card" id="loginForm">
        <h1>Sign in</h1>
        <p class="lede">Use your WeFundCo admin email to see every waitlist signup.</p>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <button class="btn btn--block" type="submit">Log in →</button>
        <p class="msg" id="msg"></p>
      </form>
    </section>
  </div>
  <script src="/admin/admin.js"></script>
</body>
</html>
